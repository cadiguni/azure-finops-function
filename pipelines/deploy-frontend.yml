trigger: none

resources:
  pipelines:
    - pipeline: FinOps-Front-build-portal
      source: FinOps-Platform\FinOps-Front-build-portal
      trigger: true
  repositories:
    - repository: DEVOPS
      type: git
      name: NAP/_git/DevOps
      # frontend/v4.7.0: cleanStrategy, pruneRetentionDays, contentCacheControl e limpeza do artefato antes do download.
      ref: 'refs/tags/frontend/v4.7.0'

variables:
  - template: config.yml
  - group: FinOps-${{ variables.Ambiente }}-Personal
  # Variáveis lidas pela validação e pelo upload do template.
  # prod → finopsplatformnapwebstg (legado), hml → finopsplatformhmlwebstg.
  - name: NomeStorage
    value: '${{ variables.NomeAplicacao }}${{ variables.SufixoRecursos }}webstg'
  - name: frontdoortier
    value: 'Standard'
  - name: ComponenteDeDominio
    value: 'finops'
  # URL pública do portal; a validação do template exige '-hml.' em hml e proíbe identificadores de ambiente em prod.
  - name: enderecoDoParcel
    value: 'https://${{ variables.PortalDomain }}/'

pool: self-hosted-agent-pool

stages:
  - template: ./templates/frontend/deploy-frontend-pcl.yml@DEVOPS
    parameters:
      ArtifactName: '${{ variables.FrontendArtifactName }}'
      NamePipelineBuild: 'FinOps-Front-build-portal'
      Project: 'azure-finops-function'
      Ambiente: '${{ variables.Ambiente }}'
      NomeAplicacao: '$(NomeAplicacao)'
      NomeStorage: '$(NomeStorage)'
      ComponenteDeDominio: 'finops'
      FrontDoorResourceGroup: '$(FrontDoorResourceGroup)'
      FrontDoorProfileName: '$(FrontDoorProfileName)'
      FrontDoorEndpointName: '$(FrontDoorEndpointName)'
      FrontDoorDomain: '$(PortalDomain)'
      # Sem limpar o $web antes do upload: evita tela branca por index.html em cache apontando para
      # assets já removidos. Arquivos de deploys anteriores são apagados após 7 dias.
      cleanStrategy: 'prune'
      pruneRetentionDays: 7
      contentCacheControl: 'no-cache, no-store, must-revalidate'
