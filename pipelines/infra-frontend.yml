trigger:
  branches:
    include:
      - main
      - homolog
  paths:
    include:
      - pipelines/terraform-frontend/**

resources:
  repositories:
    - repository: DEVOPS
      type: git
      name: NAP/_git/DevOps
      ref: 'refs/tags/terraform/v4.5.0'

parameters:
  - name: skipValidateDestroy
    displayName: '🛡️ Permitir Destruição (⚠️ false=seguro, true=permite destroy automático)'
    type: boolean
    default: false

variables:
  - template: config.yml
  - group: FinOps-${{ variables.Ambiente }}-Personal
  - group: Terraform
  # Validado pelo terraform-stage (6–24 caracteres, minúsculas). Deve bater com o storage do portal
  # criado em terraform-frontend (local.nome_base_storage + "webstg"): prod → finopsplatformnapwebstg, hml → finopsplatformhmlwebstg.
  - name: NomeStorage
    value: '${{ variables.NomeAplicacao }}${{ variables.SufixoRecursos }}webstg'

pool: self-hosted-agent-pool

stages:
  - template: ./templates/terraform/terraform-stage.yml@DEVOPS
    parameters:
      Ambiente: '${{ variables.Ambiente }}'
      NomeAplicacao: '$(NomeAplicacao)'
      ServiceConnection: '$(ServiceConnection)'
      TerraformAccessKey: '$(TerraformAccessKey)'
      workingDirectoryTF: '$(System.DefaultWorkingDirectory)/pipelines/terraform-frontend'
      tfVars: '-var "aplicacao=$(NomeAplicacao)" -var "setor=$(Setor)" -var "ambiente=$(Ambiente)"'
      backendConfigKeyTF: '$(Ambiente)/$(NomeAplicacao)-frontend.tfstate'
      tfVersionTF: '1.9.3'
      SetorContainerBackendTerraform: 'nap'
      skipValidateDestroy: '${{ parameters.skipValidateDestroy }}'
