trigger:
  branches:
    include:
      - main
      - homolog
  paths:
    include:
      - pipelines/terraform-function/**

resources:
  repositories:
    - repository: DEVOPS
      type: git
      name: NAP/_git/DevOps
      ref: 'refs/tags/terraform/v4.5.0'

parameters:
  - name: skipValidateDestroy
    displayName: '🛡️ Permitir Destruição (⚠️ false=seguro, true=permite destroy automático)'
    type: boolean
    default: false

variables:
  - template: config.yml
  - group: FinOps-${{ variables.Ambiente }}-Personal
  - group: Terraform
  - name: ownershipAudiencesEscaped
    value: $[replace(variables['OwnershipAuthAllowedAudiences'], ',', '\",\"')]
  # Validado pelo terraform-stage (6–24 caracteres, minúsculas). Deve bater com o storage da Function
  # criado em terraform-function (local.nome_base_storage + "funcstg"): prod → finopsplatformnapfuncstg, hml → finopsplatformhmlfuncstg.
  - name: NomeStorage
    value: '${{ variables.NomeAplicacao }}${{ variables.SufixoRecursos }}funcstg'

pool: self-hosted-agent-pool

stages:
  - template: ./templates/terraform/terraform-stage.yml@DEVOPS
    parameters:
      Ambiente: '${{ variables.Ambiente }}'
      NomeAplicacao: '$(NomeAplicacao)'
      ServiceConnection: '$(ServiceConnection)'
      TerraformAccessKey: '$(TerraformAccessKey)'
      workingDirectoryTF: '$(System.DefaultWorkingDirectory)/pipelines/terraform-function'
      # Valores por ambiente em terraform-function/environments/<ambiente>.tfvars.
      # Library: audiences separadas por vírgula.
      tfVars: >-
        -var-file="environments/$(Ambiente).tfvars"
        -var "aplicacao=$(NomeAplicacao)"
        -var "setor=$(Setor)"
        -var "ambiente=$(Ambiente)"
        -var "ownership_auth_allowed_audiences=[\"$(ownershipAudiencesEscaped)\"]"
      backendConfigKeyTF: '$(Ambiente)/$(NomeAplicacao).tfstate'
      tfVersionTF: '1.9.3'
      SetorContainerBackendTerraform: 'nap'
      skipValidateDestroy: '${{ parameters.skipValidateDestroy }}'
