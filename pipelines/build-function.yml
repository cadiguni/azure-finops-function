trigger: none

variables:
  - template: config.yml

pool: azp-gvdasa-be-01

stages:
  - stage: 'Build_function'
    displayName: 'Build function'
    jobs:
    - job: 'Build'
      displayName: 'Build'

      steps:
      - task: NuGetToolInstaller@1
        displayName: 'Instalar Nuget'

      - task: DotNetCoreCLI@2
        displayName: Restore
        inputs:
          command: restore
          feedsToUse: 'select'
          vstsFeed: 'Feed_NAP'
          includeNuGetOrg: true
          projects: |
            src/Gvdasa.FinOpsApi.AzureFunctions/Gvdasa.FinOpsApi.AzureFunctions.csproj
            src/Gvdasa.FinOpsApi.Domain/Gvdasa.FinOpsApi.Domain.csproj
            src/Gvdasa.FinOpsApi.Infra/Gvdasa.FinOpsApi.Infra.csproj
            src/Gvdasa.FinOpsApi.Modelos/Gvdasa.FinOpsApi.Modelos.csproj

      - task: DotNetCoreCLI@2
        displayName: Build
        inputs:
          arguments: '--configuration Release'
          feedsToUse: 'select'
          vstsFeed: 'Feed_NAP'
          includeNuGetOrg: true
          projects: |
            src/Gvdasa.FinOpsApi.AzureFunctions/Gvdasa.FinOpsApi.AzureFunctions.csproj
            src/Gvdasa.FinOpsApi.Domain/Gvdasa.FinOpsApi.Domain.csproj
            src/Gvdasa.FinOpsApi.Infra/Gvdasa.FinOpsApi.Infra.csproj
            src/Gvdasa.FinOpsApi.Modelos/Gvdasa.FinOpsApi.Modelos.csproj

      - task: DotNetCoreCLI@2
        displayName: Publish
        inputs:
          command: publish
          publishWebProjects: false
          modifyOutputPath: true
          arguments: ' src/Gvdasa.FinOpsApi.AzureFunctions/Gvdasa.FinOpsApi.AzureFunctions.csproj --configuration Release --output $(build.artifactstagingdirectory)/${{ variables.ArtifactName }}'
          zipAfterPublish: True

      - script: |
            echo "build.artifactstagingdirectory: $(build.artifactstagingdirectory)/${{ variables.ArtifactName }}"
        displayName: 'debug variables'

      - publish: $(Build.ArtifactStagingDirectory)/${{ variables.ArtifactName }}
        artifact: '${{ variables.ArtifactName }}'
        condition: succeeded()