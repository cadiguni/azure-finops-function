trigger:
  branches:
    include:
      - main
      - homolog
  paths:
    include:
      - src/**

resources:
  repositories:
    - repository: DEVOPS
      type: git
      name: NAP/_git/DevOps
      # backend/v4.7.0: publishProjects no build e limpeza do artefato antes do download no deploy.
      ref: 'refs/tags/backend/v4.7.0'

variables:
  - template: config.yml
  - group: FinOps-${{ variables.Ambiente }}-Personal

pool: self-hosted-agent-pool

stages:
  - template: templates/backend/build-backend-dotnet.yml@DEVOPS
    parameters:
      # Nome do artefato consumido pelo deploy-function.yml (ArtifactName no config.yml).
      name: '${{ variables.ArtifactName }}'
      gitversion: '5.10.1'
      vstsFeed: 'Feed_NAP'
      buildConfiguration: 'Release'
      # Só a Function: a solução também tem o projeto de testes, que não pode ir no artefato.
      pathproj: 'src/Personal.FinOpsApi.AzureFunctions/Personal.FinOpsApi.AzureFunctions.csproj'
      publishWebProjectsDeploy: false
      publishProjects: 'src/Personal.FinOpsApi.AzureFunctions/Personal.FinOpsApi.AzureFunctions.csproj'
