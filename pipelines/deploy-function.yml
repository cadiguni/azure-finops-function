trigger: none

variables:
  - template: config.yml
  - group: Terraform
  - group: FinOps-Api-${{ variables.Ambiente }}-GVdasa
  - name: tfvars
    value: '-var "aplicacao=$(NomeAplicacao)" -var "ambiente=$(Ambiente)" -var "webhookUrlTeams=$(webhookUrlTeams)"'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/pipelines/terraform'
  - name: terraformVersion
    value: '1.9.3'
    
resources:
  pipelines:
    - pipeline: FinOps-Back-build-function 
      source: FinOps-Platform\FinOps-Back-build-function 
      trigger: true

pool: azp-gvdasa-be-01

stages:
- stage: "Deploy_function"
  displayName: "Deploy Function"
  jobs:
  - job: DeployFunction
    displayName: "Deploy FinOps Function"
    steps:
    - task: TerraformInstaller@1
      displayName: "Install Terraform ${{ variables.terraformVersion }}"
      inputs:
        terraformVersion: ${{ variables.terraformVersion }}

    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: "azurerm"
        command: "init"
        commandOptions: "-upgrade"
        workingDirectory: $(workingDirectory)
        backendServiceArm: $(ServiceConnection)
        backendAzureRmResourceGroupName: $(ResourceGroupName)
        backendAzureRmStorageAccountName: $(StorageAccountName)
        backendAzureRmContainerName: $(ContainerName)
        backendAzureRmKey: "finops-$(Ambiente).tfstate"

    - task: TerraformTaskV4@4
      displayName: "Terraform Plan"
      inputs:
        provider: "azurerm"
        command: "plan"
        commandOptions: "$(tfvars) -out=finops-$(Ambiente).tfplan"
        workingDirectory: $(workingDirectory)
        environmentServiceNameAzureRM: $(ServiceConnection)

    - task: TerraformTaskV4@4
      displayName: "Terraform Apply"
      inputs:
        provider: "azurerm"
        command: "apply"
        commandOptions: "finops-$(Ambiente).tfplan"
        workingDirectory: $(workingDirectory)
        environmentServiceNameAzureRM: $(ServiceConnection)

    - task: DownloadPipelineArtifact@2
      displayName: "Download Function Artifact"
      inputs:
        buildType: 'specific'
        project: 'FinOps-Platform'
        definition: 'FinOps-Back-build-function'
        buildVersionToDownload: 'latest'
        artifactName: '${{ variables.ArtifactName }}'
        targetPath: '$(System.ArtifactsDirectory)'

    - task: AzureFunctionApp@2
      displayName: "Deploy Azure Function"
      inputs:
        connectedServiceNameARM: $(ServiceConnection)
        appType: 'functionAppLinux'
        appName: '$(NomeAplicacao)-$(Ambiente)-func'
        package: '$(System.ArtifactsDirectory)/**/*.zip'
        runtimeStack: 'DOTNET-ISOLATED|8.0'
        deploymentMethod: 'zipDeploy'

    - task: AzureCLI@2
      displayName: "Test Function Deployment"
      inputs:
        azureSubscription: $(ServiceConnection)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Get function key
          FUNCTION_KEY=$(az functionapp keys list \
            --name "$(NomeAplicacao)-$(Ambiente)-func" \
            --resource-group "$(NomeAplicacao)-$(Ambiente)-rg" \
            --query "functionKeys.default" -o tsv)
          
          # Test HTTP trigger with dry run
          echo "Testing FinOps Function..."
          curl -X GET "https://$(NomeAplicacao)-$(Ambiente)-func.azurewebsites.net/api/CostAnalysisHttpTrigger?code=$FUNCTION_KEY&dryRun=true" \
            -H "Content-Type: application/json" \
            --fail --show-error --silent
          
          echo "✅ FinOps Function deployed and responding correctly"