trigger: none

variables:
  - template: config.yml
  - group: Terraform
  - group: FinOps-func-GVdasa
  - name: tfvars
    value: '-var "aplicacao=$(NomeAplicacao)" -var "setor=$(Setor)"'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/pipelines/terraform-function'
  - name: terraformVersion
    value: '1.9.3'
    
resources:
  pipelines:
    - pipeline: FinOps-Back-build-function 
      source: FinOps-Platform\FinOps-Back-build-function 
      trigger: true

pool: azp-gvdasa-be-01

stages:
- stage: "Deploy_function"
  displayName: "Deploy Function"
  jobs:
  - job: DeployFunction
    displayName: "Deploy FinOps Function"
    steps:
    - task: TerraformInstaller@1
      displayName: "Install Terraform ${{ variables.terraformVersion }}"
      inputs:
        terraformVersion: ${{ variables.terraformVersion }}

    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        command: "init"
        backendType: azurerm
        workingDirectory: '$(System.DefaultWorkingDirectory)/pipelines/terraform-function'
        backendServiceArm: "$(ServiceConnection)"
        backendAzureRmResourceGroupName: 'terraform-rg'
        backendAzureRmStorageAccountName: "gvdasaterraformstate"
        backendAzureRmContainerName: "nap"
        backendAzureRmKey: "finops/$(NomeAplicacao).tfstate"
        commandOptions: ' -backend-config="access_key=$(TerraformAccessKey)" '

    - task: TerraformTaskV4@4
      displayName: "Terraform Plan"
      inputs:
        command: 'plan'
        provider: 'azurerm'
        environmentServiceNameAzureRM: "$(ServiceConnection)"
        workingDirectory: '$(System.DefaultWorkingDirectory)/pipelines/terraform-function'
        publishPlanResults: "PlanResults"
        commandOptions: '-input=false ${{ variables.tfvars }} -out=${{ variables.workingDirectory }}/terraform.tfplan -detailed-exitcode '

    - task: TerraformTaskV4@4
      displayName: "Terraform Apply"
      inputs:
        command: 'apply'
        provider: 'azurerm'
        environmentServiceNameAzureRM: "$(ServiceConnection)"
        workingDirectory: '$(System.DefaultWorkingDirectory)/pipelines/terraform-function'
        commandOptions: '-input=false ${{ variables.tfvars }}'
        allowTelemetryCollection: true

    - download: FinOps-Back-build-function
      displayName: 'Baixando artefatos do build da função'
      artifact: ${{ variables.ArtifactName }} #Nome do artefato que foi publicado no build

    - script: |
        echo '-------- dir -------'
        ls *
        echo '-------- dir Workspace -------'
        ls $(Pipeline.Workspace)/*
        echo '-------- verify variable -------'
        echo "Pipeline.Workspace: $(Pipeline.Workspace)"
        echo "build.artifactstagingdirectory: $(build.artifactstagingdirectory)"
        echo " ArtifactName: ${{ variables.ArtifactName }}"
      displayName: 'Debug variables'

    - task: AzureFunctionApp@1
      displayName: 'Publicando artefatos de build da função'
      inputs:
        azureSubscription: '$(ServiceConnection)'
        appType: 'functionApp'
        appName: '$(NomeAplicacao)-${{ variables.Setor }}-func'
        package: "$(Pipeline.Workspace)/FinOps-Back-build-function/${{ variables.ArtifactName }}/${{ variables.ArtifactName }}.zip"
        appSettings: >-
          -AZURE_SUBSCRIPTION_ID $(AZURE_SUBSCRIPTION_ID)
          -CostAnalysisSchedule $(CostAnalysisSchedule)
          -DailySummarySchedule $(DailySummarySchedule)
          -EnableStorageAnalyzer $(EnableStorageAnalyzer)
          -EnableVmAnalyzer $(EnableVmAnalyzer)
          -EnableAppServiceAnalyzer $(EnableAppServiceAnalyzer)
          -EnablePublicIpAnalyzer $(EnablePublicIpAnalyzer)
          -EnableDiskAnalyzer $(EnableDiskAnalyzer)
          -RESULTS_CONTAINER_NAME $(RESULTS_CONTAINER_NAME)
          -APPLICATIONINSIGHTS_CONNECTION_STRING $(APPLICATIONINSIGHTS_CONNECTION_STRING)