trigger: none

resources:
  pipelines:
    - pipeline: FinOps-Back-build-function 
      source: FinOps-Platform\FinOps-Back-build-function 
      trigger: true
  repositories:
    - repository: DEVOPS
      type: git
      name: NAP/_git/DevOps
      ref: 'refs/tags/backend/v4.7.0'

variables:
  - template: config.yml
  - group: FinOps-${{ variables.Ambiente }}-Personal
  # ServiceBus-* e apim-gateway-* removidos: runServiceBus/runApiGateway estão desligados.

pool: self-hosted-agent-pool

stages:
  - template: ./templates/backend/deploy-backend-function.yml@DEVOPS
    parameters:
      # O template usa este valor só para montar <NomeAplicacao>-<Ambiente>-func:
      # prod → finopsplatform-nap-func (legado), hml → finopsplatform-hml-func.
      Ambiente: '${{ variables.SufixoRecursos }}'
      ArtifactName: '${{ variables.ArtifactName }}'
      ServiceConnection: '$(ServiceConnection)'
      ApiId: 'finops-api'
      ApiSufixoUrl: ''
      ApiDisplayName: 'finops-api'
      swaggerUrl: ''
      sourcePipeline: 'FinOps-Back-build-function'
      packageForLinux: '**/*.zip'
      ServicoMultiTenant: false
      runServiceBus: false
      runApiGateway: false
      code_validate: |
        validate_not_empty "$(NomeAplicacao)" "NomeAplicacao"
        validate_not_empty "$(ArtifactName)" "ArtifactName"
      appType: 'functionAppLinux'
      # AppSettingsDeploy removido - todas as configurações estão no Terraform
      # Os parâmetros Enable*Analyzer não são usados pelo código
      # CostAnalysisSchedule e DailySummarySchedule estão no Terraform
      # RESULTS_CONTAINER_NAME foi movido para o Terraform
      AppSettingsDeploy: ''